<div class="cms-container">
  <div class="breadcrumb-section">
    <nav class="breadcrumb">
      <a routerLink="/dashboard" class="breadcrumb-item">Home</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item">Courses</span>
      <span class="breadcrumb-separator">/</span>
      <a routerLink="/courses" class="breadcrumb-item">Course List</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item active">Add Course</span>
    </nav>
  </div>

  <div class="form-wrapper">
    <div class="form-view-action">
      <button type="button" class="btn" (click)="viewList()">View List</button>
    </div>

    <form class="add-form" #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <h3 class="card-title">Course Information</h3>

        <div class="form-grid">
          <div class="form-group">
            <label for="code">Course Code <span class="req">*</span></label>
            <input id="code" type="text" name="code" [(ngModel)]="code" required placeholder="e.g. BTECH-CSE" class="form-control" />
          </div>

          <div class="form-group">
            <label for="name">Course Full Name <span class="req">*</span></label>
            <input id="name" type="text" name="name" [(ngModel)]="name" required placeholder="e.g. B.Tech in Computer Science & Eng." class="form-control" />
          </div>

          <div class="form-group">
            <label for="department">Department <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="department" name="department" [(ngModel)]="department" required class="form-control">
                <option value="" disabled>Select Department</option>
                <option *ngFor="let opt of departmentOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="level">Degree Level <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="level" name="level" [(ngModel)]="level" required class="form-control">
                <option *ngFor="let opt of levelOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="duration">Duration</label>
            <input id="duration" type="text" name="duration" [(ngModel)]="duration" placeholder="e.g. 4 Years" class="form-control" />
          </div>

          <div class="form-group">
            <label for="totalSemesters">Total Semesters</label>
            <input id="totalSemesters" type="number" name="totalSemesters" [(ngModel)]="totalSemesters" min="1" max="10" class="form-control" />
          </div>

          <div class="form-group">
            <label for="totalCredits">Total Credits</label>
            <input id="totalCredits" type="number" name="totalCredits" [(ngModel)]="totalCredits" class="form-control" />
          </div>

          <div class="form-group">
            <label for="intake">Annual Intake Capacity</label>
            <input id="intake" type="number" name="intake" [(ngModel)]="intake" class="form-control" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Submit</button>
          <button type="button" class="btn btn-secondary" (click)="viewList()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
