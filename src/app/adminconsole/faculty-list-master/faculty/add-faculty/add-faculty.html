<div class="add-faculty-container">
  <div class="breadcrumb-section">
    <nav class="breadcrumb">
      <a href="#" class="breadcrumb-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
      </a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item">Faculty</span>
      <span class="breadcrumb-separator">/</span>
      <a href="#" class="breadcrumb-item">Faculty List</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item active">Add Faculty</span>
    </nav>
  </div>

  <div class="form-wrapper">
    <div class="form-view-action">
      <button type="button" class="btn" (click)="viewList()">View List</button>
    </div>

    <form class="add-form" #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <h3 class="card-title">Faculty Information</h3>

        <div class="form-grid">
          <div class="form-group">
            <label for="name">Name <span class="req">*</span></label>
            <input id="name" type="text" name="name" [(ngModel)]="name" required placeholder="Enter faculty name" class="form-control" />
          </div>

          <div class="form-group">
            <label for="department">Department <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="department" name="department" [(ngModel)]="department" required class="form-control">
                <option value="" disabled>Select Department</option>
                <option *ngFor="let opt of departmentOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label for="designation">Designation <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="designation" name="designation" [(ngModel)]="designation" required class="form-control">
                <option value="" disabled>Select Designation</option>
                <option *ngFor="let opt of designationOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>

          <div class="form-group">
            <label for="status">Status <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="status" name="status" [(ngModel)]="status" required class="form-control">
                <option *ngFor="let opt of statusOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Submit</button>
        </div>
      </div>
    </form>
  </div>
</div>
