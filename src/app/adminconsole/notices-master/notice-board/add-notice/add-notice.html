<div class="cms-container">
  <div class="breadcrumb-section">
    <nav class="breadcrumb">
      <a routerLink="/dashboard" class="breadcrumb-item">Home</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item">Notices</span>
      <span class="breadcrumb-separator">/</span>
      <a routerLink="/notices" class="breadcrumb-item">Notice Board</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item active">Add Notice</span>
    </nav>
  </div>

  <div class="form-wrapper">
    <div class="form-view-action">
      <button type="button" class="btn" (click)="viewList()">View Board</button>
    </div>

    <form class="add-form" #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <h3 class="card-title">Compose Notice / Circular</h3>

        <div class="form-grid">
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="title">Notice Title <span class="req">*</span></label>
            <input id="title" type="text" name="title" [(ngModel)]="title" required placeholder="e.g. Schedule for Mid-Term Exams" class="form-control" />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <div class="select-wrapper">
              <select id="category" name="category" [(ngModel)]="category" class="form-control">
                <option *ngFor="let opt of categoryOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="audience">Target Audience</label>
            <div class="select-wrapper">
              <select id="audience" name="audience" [(ngModel)]="targetAudience" class="form-control">
                <option *ngFor="let opt of audienceOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="publishDate">Publish Date</label>
            <input id="publishDate" type="date" name="publishDate" [(ngModel)]="publishDate" class="form-control" />
          </div>

          <div class="form-group">
            <label for="expiryDate">Valid Until</label>
            <input id="expiryDate" type="date" name="expiryDate" [(ngModel)]="expiryDate" class="form-control" />
          </div>

          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="desc">Notice Content <span class="req">*</span></label>
            <textarea id="desc" name="desc" [(ngModel)]="description" required rows="5" class="form-control" placeholder="Write detailed notice information here..."></textarea>
          </div>

          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="attachment">Attachment Document (Optional)</label>
            <input id="attachment" type="text" name="attachment" [(ngModel)]="attachmentName" placeholder="e.g. Schedule_2026.pdf" class="form-control" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Publish Notice</button>
          <button type="button" class="btn btn-secondary" (click)="viewList()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
