<div class="cms-container">
  <div class="breadcrumb-section">
    <nav class="breadcrumb">
      <a routerLink="/dashboard" class="breadcrumb-item">Home</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item">Settings</span>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item active">Change Password</span>
    </nav>
  </div>

  <div class="form-wrapper">
    <div class="p-3 mx-auto my-2 alert alert-danger" style="max-width: 600px;" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="p-3 mx-auto my-2 alert alert-success" style="max-width: 600px;" *ngIf="successMessage">
      ✓ {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-card mx-auto" style="max-width: 600px;">
        <h3 class="card-title">Security & Password Update</h3>

        <div class="d-flex flex-column gap-3">
          <div class="form-group">
            <label for="currentPass">Current Password <span class="req">*</span></label>
            <input id="currentPass" type="password" [(ngModel)]="currentPassword" name="currentPass" required placeholder="Enter current password" class="form-control" />
          </div>

          <div class="form-group">
            <label for="newPass">New Password <span class="req">*</span></label>
            <input id="newPass" type="password" [(ngModel)]="newPassword" name="newPass" required placeholder="At least 6 characters" class="form-control" />
            <div *ngIf="newPassword" class="mt-1">
              <div class="progress" style="height: 4px;">
                <div class="progress-bar" [ngClass]="passwordStrength.color" [style.width]="passwordStrength.width"></div>
              </div>
              <small class="text-muted fs-11">Strength: <strong>{{ passwordStrength.text }}</strong></small>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPass">Confirm New Password <span class="req">*</span></label>
            <input id="confirmPass" type="password" [(ngModel)]="confirmPassword" name="confirmPass" required placeholder="Re-enter new password" class="form-control" />
          </div>
        </div>

        <div class="form-actions mt-4">
          <button type="submit" class="btn btn-primary">Update Password</button>
        </div>
      </div>
    </form>
  </div>
</div>
