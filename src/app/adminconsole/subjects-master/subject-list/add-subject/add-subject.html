<div class="cms-container">
  <div class="breadcrumb-section">
    <nav class="breadcrumb">
      <a routerLink="/dashboard" class="breadcrumb-item">Home</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item">Subjects</span>
      <span class="breadcrumb-separator">/</span>
      <a routerLink="/subjects" class="breadcrumb-item">Subject List</a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-item active">Add Subject</span>
    </nav>
  </div>

  <div class="form-wrapper">
    <div class="form-view-action">
      <button type="button" class="btn" (click)="viewList()">View List</button>
    </div>

    <form class="add-form" #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-card">
        <h3 class="card-title">Subject Information</h3>

        <div class="form-grid">
          <div class="form-group">
            <label for="code">Subject Code <span class="req">*</span></label>
            <input id="code" type="text" name="code" [(ngModel)]="code" required placeholder="e.g. CS301" class="form-control" />
          </div>

          <div class="form-group">
            <label for="name">Subject Name <span class="req">*</span></label>
            <input id="name" type="text" name="name" [(ngModel)]="name" required placeholder="e.g. Data Structures & Algorithms" class="form-control" />
          </div>

          <div class="form-group">
            <label for="course">Course <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="course" name="course" [(ngModel)]="course" required class="form-control">
                <option value="" disabled>Select Course</option>
                <option *ngFor="let c of courseOptions" [value]="c">{{ c }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="semester">Semester <span class="req">*</span></label>
            <div class="select-wrapper">
              <select id="semester" name="semester" [(ngModel)]="semester" required class="form-control">
                <option value="" disabled>Select Semester</option>
                <option *ngFor="let s of semesterOptions" [value]="s">{{ s }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="type">Subject Type</label>
            <div class="select-wrapper">
              <select id="type" name="type" [(ngModel)]="type" class="form-control">
                <option *ngFor="let t of typeOptions" [value]="t">{{ t }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>

          <div class="form-group">
            <label for="credits">Credit Hours</label>
            <input id="credits" type="number" name="credits" [(ngModel)]="credits" min="1" max="6" class="form-control" />
          </div>

          <div class="form-group">
            <label for="faculty">Assigned Faculty</label>
            <div class="select-wrapper">
              <select id="faculty" name="faculty" [(ngModel)]="faculty" class="form-control">
                <option value="">Select Faculty (Optional)</option>
                <option *ngFor="let f of facultyOptions" [value]="f">{{ f }}</option>
              </select>
              <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Submit</button>
          <button type="button" class="btn btn-secondary" (click)="viewList()">Cancel</button>
        </div>
      </div>
    </form>
  </div>
</div>
