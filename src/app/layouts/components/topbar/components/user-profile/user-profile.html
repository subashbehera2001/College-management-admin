<div class="topbar-item nav-user">
  <div ngbDropdown [placement]="'bottom-end'" class="dropdown">
    <button
      ngbDropdownToggle
      class="user-profile-trigger dropdown-toggle drop-arrow-none"
      type="button"
      id="userProfileDropdown"
      aria-label="User Profile Menu"
    >
      <div class="user-avatar-wrap">
        <img
          [src]="currentUser?.avatar || 'assets/images/passport.png'"
          width="34"
          height="34"
          class="rounded-circle user-avatar-img"
          alt="User Profile"
        />
        <span class="avatar-status-dot" title="Online"></span>
      </div>
    </button>

    <div
      ngbDropdownMenu
      aria-labelledby="userProfileDropdown"
      class="dropdown-menu dropdown-menu-end profile-dropdown-panel"
    >
      <!-- User Identity Header -->
      <div class="user-header-card d-flex align-items-center gap-2">
        <img
          [src]="currentUser?.avatar || 'assets/images/passport.png'"
          width="38"
          height="38"
          class="rounded-circle header-avatar"
          alt="Avatar"
        />
        <div class="user-meta text-truncate">
          <span class="user-full-name text-truncate">
            {{ currentUser?.name || 'Debasis Mohanty' }}
          </span>
          <span class="badge-role">{{ currentUser?.role || 'Admin Head' }}</span>
        </div>
      </div>

      <div class="dropdown-divider"></div>

      <!-- Navigation Menu Items -->
      <a
        routerLink="/settings/profile"
        class="profile-menu-item"
      >
        <div class="menu-item-icon-box icon-profile">
          <ng-icon name="tablerUser" size="17" />
        </div>
        <div class="menu-item-content">
          <span class="menu-item-title">Profile</span>
          <span class="menu-item-desc">Account & personal info</span>
        </div>
        <ng-icon name="tablerChevronRight" size="14" class="menu-item-arrow" />
      </a>

      <a
        routerLink="/settings/change-password"
        class="profile-menu-item"
      >
        <div class="menu-item-icon-box icon-password">
          <ng-icon name="tablerLock" size="17" />
        </div>
        <div class="menu-item-content">
          <span class="menu-item-title">Change Password</span>
          <span class="menu-item-desc">Security & credentials</span>
        </div>
        <ng-icon name="tablerChevronRight" size="14" class="menu-item-arrow" />
      </a>

      <div class="dropdown-divider"></div>

      <!-- Logout Item -->
      <a
        routerLink="/logout"
        class="profile-menu-item item-logout"
      >
        <div class="menu-item-icon-box icon-logout">
          <ng-icon name="tablerLogout2" size="17" />
        </div>
        <div class="menu-item-content">
          <span class="menu-item-title">Log Out</span>
          <span class="menu-item-desc">End your current session</span>
        </div>
      </a>
    </div>
  </div>
</div>
