<div class="container-fluid">
  <app-page-title
    title="Contact Directory App"
    subTitle="Effortlessly manage and browse contacts with a clean, searchable interface. Ideal for teams, organizations, and internal directories."
    [badge]="{icon: 'lucideNotebookText', text: 'People & Teams'}"
  />

  <div class="row mb-3">
    <div class="col-lg-12">
      <form class="rounded border p-3">
        <div class="row gap-3">
          <div class="col-lg-4">
            <div class="app-search">
              <input
                type="text"
                class="form-control"
                placeholder="Search contact name..."
              />
              <ng-icon name="lucideSearch" class="app-search-icon text-muted" />
            </div>
          </div>
          <div class="col">
            <div
              class="d-flex justify-content-end flex-wrap align-items-center gap-2"
            >
              <div class="app-search">
                <select class="form-select form-control my-1 my-md-0">
                  <option selected>Designation</option>
                  <option value="Manager">Manager</option>
                  <option value="Developer">Developer</option>
                  <option value="Designer">Designer</option>
                  <option value="Sales">Sales</option>
                  <option value="Support">Support</option>
                </select>
                <ng-icon
                  name="lucideUserCheck"
                  class="app-search-icon text-muted"
                />
              </div>

              <div class="app-search">
                <select class="form-select form-control my-1 my-md-0">
                  <option selected>Location</option>
                  <option value="USA">USA</option>
                  <option value="UK">UK</option>
                  <option value="Germany">Germany</option>
                  <option value="India">India</option>
                  <option value="Canada">Canada</option>
                </select>
                <ng-icon
                  name="lucideMapPin"
                  class="app-search-icon text-muted"
                />
              </div>

              <div class="app-search">
                <select class="form-select form-control my-1 my-md-0">
                  <option selected>Department</option>
                  <option value="UI/UX">UI/UX</option>
                  <option value="Engineering">Engineering</option>
                  <option value="HR">HR</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Finance">Finance</option>
                </select>
                <ng-icon
                  name="lucideLayers"
                  class="app-search-icon text-muted"
                />
              </div>

              <button type="submit" class="btn btn-primary">Apply</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="row row-cols-xxl-4 row-cols-md-2 row-cols-1">
    @for (contact of contacts; track $index) {
    <div class="col">
      <app-contact-card [contact]="contact" />
    </div>
    }
  </div>

  <ul
    class="pagination pagination-rounded pagination-boxed justify-content-center mb-3"
  >
    <li class="page-item">
      <a class="page-link" href="javascript: void(0);" aria-label="Previous">
        <span aria-hidden="true">«</span>
      </a>
    </li>
    <li class="page-item active">
      <a class="page-link" href="javascript: void(0);">1</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="javascript: void(0);">2</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="javascript: void(0);">3</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="javascript: void(0);">4</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="javascript: void(0);">5</a>
    </li>
    <li class="page-item">
      <a class="page-link" href="javascript: void(0);" aria-label="Next">
        <span aria-hidden="true">»</span>
      </a>
    </li>
  </ul>
</div>
