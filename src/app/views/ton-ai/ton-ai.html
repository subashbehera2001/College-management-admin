<div class="container-fluid">
  <div class="outlook-box mt-4">
    <ng-template #content>
      <app-sidebar />
    </ng-template>
    <app-sidebar class="d-lg-block d-none outlook-left-menu rounded-start-4" />

    <div
      class="card mb-0 rounded-0 flex-grow-1"
      style="min-height: calc(100vh - 168px)"
    >
      <div class="card-header d-lg-none d-flex">
        <button
          class="btn btn-sm btn-default btn-icon"
          type="button"
          (click)="open(content)"
        >
          <ng-icon name="tablerMenu2" class="fs-lg" />
        </button>
      </div>

      <div
        class="card-body d-flex flex-column justify-content-between align-items-center h-100"
      >
        <div class="row justify-content-center">
          <div class="col-xl-8">
            <div class="mt-3">
              <div class="avatar avatar-sm rounded-circle mx-auto text-bg-dark">
                <span class="avatar-title">
                  <ng-icon name="lucideSparkles" class="fs-md" />
                </span>
              </div>
              <h3 class="mb-4 mt-2 text-center">How can I help, Maxine 👋?</h3>

              <div class="py-4">
                <div class="row g-2">
                  @for (feature of features; track $index) {
                  <div class="col-md-4">
                    <div class="card card-hovered rounded-3">
                      <div class="card-body">
                        <div
                          class="avatar-lg mb-2 rounded-circle text-bg-light d-flex align-items-center justify-content-center"
                        >
                          <ng-icon [name]="feature.icon" class="fs-xxl" />
                        </div>
                        <p class="mb-0 text-muted">{{ feature.title }}</p>
                        <a
                          href="javascript:void(0);"
                          class="stretched-link"
                        ></a>
                      </div>
                    </div>
                  </div>
                  }
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="w-100 text-center">
          <div class="card-body">
            <textarea
              class="form-control"
              id="exampleFormControlTextarea1"
              rows="4"
              placeholder="Enter message"
            ></textarea>
            <div class="d-flex gap-1 mt-2 align-items-center">
              <button
                type="button"
                class="btn btn-sm btn-icon btn-default"
                placement="top"
                ngbTooltip="Attach files"
              >
                <ng-icon name="tablerPaperclip" class="fs-sm" />
              </button>
              <button
                type="button"
                class="btn btn-sm btn-icon btn-default"
                placement="top"
                ngbTooltip="Insert link"
              >
                <ng-icon name="tablerLink" class="fs-sm" />
              </button>
              <button
                type="button"
                class="btn btn-sm btn-icon btn-default"
                data-bs-toggle="tooltip"
                data-bs-trigger="hover"
                placement="top"
                ngbTooltip="Insert photo"
              >
                <ng-icon name="tablerPhotoUp" class="fs-sm" />
              </button>
              <button
                type="button"
                class="btn btn-sm btn-icon btn-default"
                data-bs-toggle="tooltip"
                data-bs-trigger="hover"
                placement="top"
                ngbTooltip="Voice"
              >
                <ng-icon name="tablerMicrophone" class="fs-sm" />
              </button>
              <button type="button" class="btn btn-sm btn-primary ms-auto">
                <ng-icon name="tablerSend" class="fs-sm me-1" />
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
